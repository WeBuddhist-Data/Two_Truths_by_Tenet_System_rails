# Build reader-app/ and publish it to GitHub Pages.
# The site is built from the committed reader-app/public/data/ (re-run
# `npm run export-data` locally and commit the result when the vault texts change).
name: Deploy reader app to GitHub Pages

on:
  push:
    branches: [main, restructure-rails-layout]
    paths:
      - 'reader-app/**'
      - '.github/workflows/deploy-reader-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reader-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
